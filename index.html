<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水剑丹 · 作品集</title>
  <style>
    /* 全局重置 & 字体 — 仿苹果系统字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      line-height: 1.5;
    }

    /* 容器 */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== 导航栏 ===== */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .nav-links {
      display: flex;
      gap: 32px;
      font-size: 16px;
      color: #6e6e73;
    }

    .nav-links a {
      text-decoration: none;
      color: inherit;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #0071e3;
    }

    /* ===== 英雄区 (大标题) ===== */
    .hero {
      text-align: center;
      padding: 80px 0 60px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #1d1d1f 40%, #86868b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 24px;
      color: #6e6e73;
      margin-top: 12px;
      font-weight: 400;
    }

    /* ===== 项目展示区 ===== */
    .section-title {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 60px 0 30px;
      text-align: center;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px 24px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    }

    .card-img {
      width: 100%;
      height: 160px;
      background: #e8e8ed;
      border-radius: 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8e8e93;
      font-size: 14px;
      background-image: linear-gradient(145deg, #f0f0f2, #dcdcdf);
    }

    .card h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card p {
      color: #6e6e73;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ===== 页脚 ===== */
    .footer {
      text-align: center;
      padding: 40px 0 30px;
      border-top: 1px solid rgba(0,0,0,0.05);
      color: #8e8e93;
      font-size: 14px;
      margin-top: 20px;
    }

    /* ===== 响应式微调 ===== */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 34px;
      }
      .hero p {
        font-size: 18px;
      }
      .nav-links {
        gap: 18px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 导航栏 -->
    <nav class="navbar">
      <span class="logo">水剑丹</span>
      <div class="nav-links">
        <a href="#">作品</a>
        <a href="#">关于</a>
        <a href="#">联系</a>
      </div>
    </nav>

    <!-- 英雄区 -->
    <section class="hero">
      <h1>你好，我是水剑丹</h1>
      <p>创意开发者 · 设计师 · 音乐爱好者</p>
    </section>

    <!-- 项目展示 -->
    <h2 class="section-title">最近项目</h2>
    <div class="projects">

      <div class="card">
        <div class="card-img">📸 图片占位</div>
        <h3>摄影作品集</h3>
        <p>街拍与人像，用镜头记录瞬间。</p>
      </div>

      <div class="card">
        <div class="card-img">🎵 音乐占位</div>
        <h3>原创音乐小样</h3>
        <p>电子 & 氛围，聆听内心的声音。</p>
      </div>

      <div class="card">
        <div class="card-img">💻 项目占位</div>
        <h3>交互式网页</h3>
        <p>用 Three.js 打造的 3D 体验。</p>
      </div>

    </div>
  </div>

  <!-- 页脚 -->
  <div class="footer">
    <div class="container">
      &copy; 2026 水剑丹 · 用 ♥ 和 ☕ 构建
    </div>
  </div>

</body>
</html>
